name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/mzpdqk/devops/catty-reminders-app

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            export DEPLOY_REF=${{ github.sha }}
            export IMAGE=ghcr.io/$OWNER/catty-reminders-app:${{ github.sha }}
            export APP_CONTAINER_NAME=catty-app
            export MARIADB_ROOT_PASSWORD=mypass
            export MARIADB_DATABASE=catty_reminders
            export HOST_APP_PORT=8181
            export CONTEINER_APP_PORT=8181

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose up -d --pull always --remove-orphans --force-recreate
