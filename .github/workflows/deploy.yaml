name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/mzpdqk/devops/catty-reminders-app

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            export IMAGE=ghcr.io/$OWNER/catty-reminders-app:${{ github.sha }}
            export APP_CONTAINER_NAME=catty-app

            export MARIADB_ROOT_PASSWORD=mypass
            export MARIADB_USER=mzpdqk
            export MARIADB_PASSWORD=mypass
            export MARIADB_DATABASE=catty_reminders

            export HOST_APP_PORT=8181
            export CONTEINER_APP_PORT=8181

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 1. Убедиться, что db запущен (поднимется, если упал)
            docker compose up -d db

            # 2. Дождаться готовности db через healthcheck (макс 60 сек)
            echo "Waiting for db to be healthy..."
            for i in $(seq 1 60); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' catty-db 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "DB healthy after ${i}s"
                break
              fi
              sleep 1
            done

            # 3. Pull только app image
            docker compose pull catty-app

            # 4. Пересоздать ТОЛЬКО app, не трогая db
            docker compose up -d --no-deps --force-recreate catty-app

            # 5. Показать статус
            sleep 3
            docker compose ps

            echo "Deployed ${{ github.sha }}"
