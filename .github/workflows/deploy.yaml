name: CD

on:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (build check)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build artifact
        run: |
          mkdir -p dist
          tar -czf dist/app-${{ github.ref_name }}.tar.gz app requirements.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -x
            cd /home/mzpdqk/devops/catty-reminders-app
            git fetch origin
            git reset --hard ${{ github.sha }}
            echo "DEPLOY_REF=$(git rev-parse HEAD)" > .env
            if [ -f requirements.txt ]; then
              /home/mzpdqk/devops/catty-reminders-app/venv/bin/pip install -q -r requirements.txt
            fi
            sudo -n systemctl daemon-reload
            sudo -n systemctl restart app.service
            echo "Deployed $(git rev-parse HEAD)"
